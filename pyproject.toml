[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-sim"
version = "0.1.0"
description = "Helix explicit network and hybrid simulation language"
requires-python = ">=3.10"

[project.scripts]
helix = "helix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
